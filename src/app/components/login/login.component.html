<div class="login-wrap">
  <div class="login-card">

    <div class="login-brand">
      <img src="assets/img/POS4.png" alt="POS">
    </div>

    <h1 class="login-title">Iniciar sesión</h1>
    <p class="login-sub">Ingresa tus credenciales para continuar</p>

    <form (ngSubmit)="onLogin()" name="loginForm" [formGroup]="formLogin" class="login-form">
      <mat-form-field class="full-width" appearance="outline">
        <mat-label>Email o Usuario</mat-label>
        <input formControlName="email" matInput autocomplete="off" />
        <mat-icon matSuffix>mail</mat-icon>
      </mat-form-field>

      <mat-form-field class="full-width" appearance="outline">
        <mat-label>Contraseña</mat-label>
        <input matInput [type]="hidePassword ? 'password' : 'text'" formControlName="password" autocomplete="off">
        <button mat-icon-button matSuffix (click)="hidePassword = !hidePassword" [attr.aria-label]="'Hide password'" [attr.aria-pressed]="hidePassword" type="button">
          <mat-icon>{{hidePassword ? 'visibility_off' : 'visibility'}}</mat-icon>
        </button>
      </mat-form-field>

      <button class="full-width login-btn" mat-raised-button color="primary" type="submit" [disabled]="formLogin.invalid || loading">
        <mat-icon>login</mat-icon>
        Ingresar
      </button>
    </form>

    @if (loading) {
      <mat-progress-bar mode="indeterminate" class="login-progress"></mat-progress-bar>
    }

  </div>
</div>
