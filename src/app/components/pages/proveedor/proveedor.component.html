<div class="page">

  <header class="page-header">
    <h1 class="page-title">
      <span class="title-icon"><mat-icon>contacts</mat-icon></span>
      Proveedores
    </h1>
    <button mat-raised-button color="primary" (click)="agregarProducto()">
      <mat-icon>add</mat-icon> Nuevo Proveedor
    </button>
  </header>

  <section class="surface-card">

    <div class="card-toolbar">
      <mat-form-field appearance="outline" class="filter-field" subscriptSizing="dynamic">
        <mat-label>Buscar</mat-label>
        <input matInput (keyup)="applyFilter($event)" #input placeholder="Rut, descripción...">
        <mat-icon matSuffix>search</mat-icon>
      </mat-form-field>
    </div>

    <div class="card-body">
      <div class="table-wrap">
        <div class="table-scroll">
          <table mat-table [dataSource]="dataSource">

            <ng-container matColumnDef="Rut_Proveedor">
              <th mat-header-cell *matHeaderCellDef> Rut Proveedor </th>
              <td mat-cell *matCellDef="let element"> {{element.rut_proveedor}} </td>
            </ng-container>

            <ng-container matColumnDef="Descripcion">
              <th mat-header-cell *matHeaderCellDef> Descripcion </th>
              <td mat-cell *matCellDef="let element"> {{element.desc_proveedor}} </td>
            </ng-container>

            <ng-container matColumnDef="Estado">
              <th mat-header-cell *matHeaderCellDef> Estado </th>
              <td mat-cell *matCellDef="let element">
                @if (element.esActivo==true) {
                  <span class="badge-ok">Activo</span>
                }
                @if (element.esActivo==false) {
                  <span class="badge-off">Inactivo</span>
                }
              </td>
            </ng-container>

            <ng-container matColumnDef="Productos">
              <th mat-header-cell *matHeaderCellDef> Productos </th>
              <td mat-cell *matCellDef="let element">
                <button mat-icon-button color="primary" (click)="verProductos(element)" matTooltip="Ver productos">
                  <mat-icon>inventory</mat-icon>
                </button>
              </td>
            </ng-container>

            <ng-container matColumnDef="acciones">
              <th mat-header-cell *matHeaderCellDef style="width:120px"> </th>
              <td mat-cell *matCellDef="let element">
                <button mat-icon-button color="primary" (click)="editarProducto(element)" matTooltip="Editar">
                  <mat-icon>edit</mat-icon>
                </button>
                <button mat-icon-button color="warn" (click)="eliminarProducto(element)" matTooltip="Eliminar">
                  <mat-icon>delete</mat-icon>
                </button>
              </td>
            </ng-container>

            <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
            <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

            <tr class="mat-row" *matNoDataRow>
              <td class="mat-cell empty-cell" [attr.colspan]="displayedColumns.length">
                No hay resultados para "{{input.value}}"
              </td>
            </tr>
          </table>
        </div>

        <mat-paginator [pageSizeOptions]="[5, 10, 20]"
          showFirstLastButtons
          aria-label="Seleccionar página">
        </mat-paginator>
      </div>
    </div>

  </section>
</div>
