<div class="page">

  <header class="page-header">
    <h1 class="page-title">
      <span class="title-icon"><mat-icon>group</mat-icon></span>
      Usuarios
    </h1>
    <button mat-raised-button color="primary" (click)="agregarUsuario()">
      <mat-icon>add</mat-icon> Nuevo Usuario
    </button>
  </header>

  <section class="surface-card">

    <div class="card-toolbar">
      <mat-form-field appearance="outline" class="filter-field" subscriptSizing="dynamic">
        <mat-label>Buscar</mat-label>
        <input matInput (keyup)="applyFilter($event)" #input placeholder="Nombre, correo, rol...">
        <mat-icon matSuffix>search</mat-icon>
      </mat-form-field>
    </div>

    <div class="card-body">
      <div class="table-wrap">
        <div class="table-scroll">
          <table mat-table [dataSource]="dataSource">

            <ng-container matColumnDef="nombreApellidos">
              <th mat-header-cell *matHeaderCellDef> Nombre y Apellidos </th>
              <td mat-cell *matCellDef="let element"> {{element.nombreApellidos}} </td>
            </ng-container>

            <ng-container matColumnDef="correo">
              <th mat-header-cell *matHeaderCellDef> Correo </th>
              <td mat-cell *matCellDef="let element"> {{element.correo}} </td>
            </ng-container>

            <ng-container matColumnDef="rolDescripcion">
              <th mat-header-cell *matHeaderCellDef> Rol </th>
              <td mat-cell *matCellDef="let element"> {{element.rolDescripcion}} </td>
            </ng-container>

            <ng-container matColumnDef="usuario">
              <th mat-header-cell *matHeaderCellDef> Usuario </th>
              <td mat-cell *matCellDef="let element"> {{element.usuario}} </td>
            </ng-container>

            <ng-container matColumnDef="acciones">
              <th mat-header-cell *matHeaderCellDef style="width:120px"> </th>
              <td mat-cell *matCellDef="let element">
                <button mat-icon-button color="primary" (click)="editarUsuario(element)" matTooltip="Editar">
                  <mat-icon>edit</mat-icon>
                </button>
                <button mat-icon-button color="warn" (click)="eliminarUsuario(element)" matTooltip="Eliminar">
                  <mat-icon>delete</mat-icon>
                </button>
              </td>
            </ng-container>

            <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
            <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

            <tr class="mat-row" *matNoDataRow>
              <td class="mat-cell empty-cell" [attr.colspan]="displayedColumns.length">
                No hay resultados para "{{input.value}}"
              </td>
            </tr>
          </table>
        </div>

        <mat-paginator [pageSizeOptions]="[5, 10, 20]"
          showFirstLastButtons
          aria-label="Seleccionar página">
        </mat-paginator>
      </div>
    </div>

  </section>
</div>
