<div class="page">

  <header class="page-header">
    <div>
      <h1 class="page-title">
        <span class="title-icon"><mat-icon>dashboard</mat-icon></span>
        Dashboard
      </h1>
      <p class="page-subtitle">Resumen de la última semana</p>
    </div>
  </header>

  <div class="stats-grid">

    <div class="stat-card">
      <span class="stat-icon icon-ingresos"><mat-icon>payments</mat-icon></span>
      <div class="stat-text">
        <span class="stat-label">Total Ingresos</span>
        <strong class="stat-value">{{totalIngresos | currency:'CLP'}}</strong>
      </div>
    </div>

    <div class="stat-card">
      <span class="stat-icon icon-ventas"><mat-icon>sell</mat-icon></span>
      <div class="stat-text">
        <span class="stat-label">Total Ventas</span>
        <strong class="stat-value">{{totalVentas}}</strong>
      </div>
    </div>

    <div class="stat-card">
      <span class="stat-icon icon-productos"><mat-icon>collections_bookmark</mat-icon></span>
      <div class="stat-text">
        <span class="stat-label">Total Productos</span>
        <strong class="stat-value">{{totalProductos}}</strong>
      </div>
    </div>

  </div>

  <section class="surface-card charts-card">
    <mat-tab-group animationDuration="250ms">
      <mat-tab label="Ventas Diarias">
        <div class="chart-box">
          <canvas #myChart id="myChart"></canvas>
        </div>
      </mat-tab>
      <mat-tab label="Ventas por Producto">
        <div class="chart-box">
          <canvas #myChart2 id="myChart2"></canvas>
        </div>
      </mat-tab>
      <mat-tab label="Ventas por Cantidad de Producto">
        <div class="chart-box">
          <canvas #myChart3 id="myChart3"></canvas>
        </div>
      </mat-tab>
    </mat-tab-group>
  </section>

</div>
