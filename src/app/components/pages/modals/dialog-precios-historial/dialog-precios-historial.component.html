<h2 mat-dialog-title>Historial de Precio</h2>
<mat-dialog-content>
  <div class="table-wrap dialog-table">
    <div class="table-scroll">
      <table mat-table [dataSource]="dataSource">

        <ng-container matColumnDef="precio">
          <th mat-header-cell *matHeaderCellDef> Precio </th>
          <td mat-cell *matCellDef="let element"> {{element.precio}} </td>
        </ng-container>

        <ng-container matColumnDef="fechaModificacion">
          <th mat-header-cell *matHeaderCellDef> Fecha Modificacion </th>
          <td mat-cell *matCellDef="let element"> {{element.fechaModificacion | date:'yyyy-MM-dd HH:mm'}} </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
      </table>
    </div>
  </div>
</mat-dialog-content>
<div mat-dialog-actions align="end">
  <button mat-raised-button color="primary" mat-dialog-close>Volver</button>
</div>
