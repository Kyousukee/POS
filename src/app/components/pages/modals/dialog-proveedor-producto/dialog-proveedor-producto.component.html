<h2 mat-dialog-title>Productos del Proveedor</h2>
<mat-dialog-content>

  <div class="dialog-toolbar">
    <button mat-raised-button color="primary" (click)="agregarProductoProveedor()">
      <mat-icon>add</mat-icon> Nuevo Producto
    </button>
  </div>

  <div class="table-wrap dialog-table">
    <div class="table-scroll">
      <table mat-table [dataSource]="dataSource">

        <ng-container matColumnDef="producto">
          <th mat-header-cell *matHeaderCellDef> Producto </th>
          <td mat-cell *matCellDef="let element"> {{element.desc_producto}} </td>
        </ng-container>

        <ng-container matColumnDef="precio">
          <th mat-header-cell *matHeaderCellDef> Precio </th>
          <td mat-cell *matCellDef="let element"> {{element.precio}} </td>
        </ng-container>

        <ng-container matColumnDef="Estado">
          <th mat-header-cell *matHeaderCellDef> Estado </th>
          <td mat-cell *matCellDef="let element">
            @if (element.esActivo==true) {
              <span class="badge-ok">Activo</span>
            }
            @if (element.esActivo==false) {
              <span class="badge-off">Inactivo</span>
            }
          </td>
        </ng-container>

        <ng-container matColumnDef="accion">
          <th mat-header-cell *matHeaderCellDef style="width:120px"> </th>
          <td mat-cell *matCellDef="let element">
            <button mat-icon-button color="primary" (click)="editarProducto(element)" matTooltip="Editar">
              <mat-icon>edit</mat-icon>
            </button>
            <button mat-icon-button color="warn" (click)="eliminarProveedorProducto(element)" matTooltip="Eliminar">
              <mat-icon>delete</mat-icon>
            </button>
          </td>
        </ng-container>

        <ng-container matColumnDef="precioHistorial">
          <th mat-header-cell *matHeaderCellDef> Historial Precios </th>
          <td mat-cell *matCellDef="let element">
            <button mat-icon-button color="primary" (click)="verPrecioHistorial(element)" matTooltip="Ver historial">
              <mat-icon>price_change</mat-icon>
            </button>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
      </table>
    </div>
  </div>

</mat-dialog-content>
<div mat-dialog-actions align="end">
  <button mat-raised-button color="primary" mat-dialog-close>Volver</button>
</div>
